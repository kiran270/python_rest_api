name: Docker Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: flask-rest-api

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container for testing
        run: |
          docker run -d -p 5000:5000 --name test-container ${{ env.IMAGE_NAME }}:latest
          sleep 5

      - name: Test health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status $response"
            exit 1
          fi
          echo "Health check passed"

      - name: Test API endpoints
        run: |
          curl -f http://localhost:5000/ || exit 1
          curl -f -X POST http://localhost:5000/api/items \
            -H "Content-Type: application/json" \
            -d '{"name": "Test Item", "description": "Test"}' || exit 1
          curl -f http://localhost:5000/api/items || exit 1
          echo "All tests passed"

      - name: Stop container
        if: always()
        run: docker stop test-container && docker rm test-container
